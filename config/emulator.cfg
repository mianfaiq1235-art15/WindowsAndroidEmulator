# Windows Android Emulator Configuration

# System Configuration
ram=2048
cpu_cores=2
cpu_thread_count=4

# Display Settings
resolution_width=1280
resolution_height=720
target_fps=60
vsync=1
graphics_api=DirectX11

# Android Configuration
android_version=13.0
api_level=33

# Storage
data_directory=./android_data
sdcard_size=2048

# Performance
enable_gpu_acceleration=true
enable_kvm=false
enable_snapshot=true

# Audio
enable_audio=true
audio_volume=100

# Input
enable_keyboard=true
enable_mouse=true
enable_touchscreen=true

# Network
enable_network=true
proxy_enabled=false

# Google Services
enable_google_play_store=true
enable_google_sync=true
